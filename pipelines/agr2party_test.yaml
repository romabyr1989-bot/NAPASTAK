# agr2party_test — local end-to-end proof of the J3 consents->clients linkage,
# with a LIVE CDI proxy (the concurrent-HTTP fix is what lets a python_file step
# call a service that itself queries the gateway, without the old deadlock).
# python_file -> repo path; MASTER_API_URL is taken from the gateway env.

name: agr2party_test
enabled: false

steps:
  - id: process_delta
    transform_sql: |
      SELECT
        a.agreement_id, a.abs_cd, a.owner_id, a.agreement_type_cd,
        a.created_ts, a.expired_ts, a.last_upd_ts, a.deleted_ts,
        a.scopes_ls, a.agreement_file_link,
        c.party_id, c.last_name, c.first_name, c.middle_name, c.birth_date, c.inn
      FROM consents_agreements a
      LEFT JOIN cdi_physical_party c ON c.owner_id = a.owner_id
      WHERE a.deleted_ts IS NULL OR a.deleted_ts = ''
    python_file: "/Users/romanbirukov/Documents/develop/DataFlow-OS/tools/agr2party/connector.py"
    python_context_dir: "/tmp/dfo_agr2party_test"
    python_timeout_sec: 600
    target_table: "agreements_agreement2party"
