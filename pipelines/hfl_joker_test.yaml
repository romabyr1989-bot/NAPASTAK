# hfl_joker_test — local end-to-end proof of the J1 CDI ingestion path.
# Same logic as hfl_joker.yaml (Kafka CDI topic -> joker_transform -> CDI), but
# points at the LOCAL Redpanda broker (the prod kafka.prod.internal is
# DNS-unresolvable on this stand) and the repo joker_transform.py. data_format
# is "raw" so the python step receives the raw JSON message in a `value` column.

name: hfl_joker_test
enabled: false

steps:

  - id: read_kafka
    connector_type: kafka
    connector_config:
      brokers: "127.0.0.1:9092"
      topic: "cdi_phys_j1"
      group_id: "dfo_hfl_joker_test_v1"
      offset_reset: "earliest"
      data_format: "raw"
      batch_size: "1000"
    target_table: "cdi_joker_incoming_buf"

  - id: transform_joker
    transform_sql: "SELECT value FROM cdi_joker_incoming_buf"
    python_file: "/Users/romanbirukov/Documents/develop/DataFlow-OS/tools/cdi/joker_transform.py"
    python_context_dir: "/tmp/dfo_joker_test"
    python_timeout_sec: 300
    target_table: "cdi_physical_party_j1"
    deps: [0]
