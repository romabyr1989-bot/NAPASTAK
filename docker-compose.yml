services:
  dfo:
    build: .
    image: dataflow-os:latest
    container_name: dataflow-os
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      DATA_DIR:       /data
      PLUGINS_DIR:    /app/lib
      PORT:           8080
      JWT_SECRET:     a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
      ADMIN_PASSWORD: admin
      TLS_CERT:       /app/certs/cert.pem
      TLS_KEY:        /app/certs/key.pem
    volumes:
      - dfo_data:/data
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://localhost:8443/ || exit 1"]
      interval: 15s
      timeout:  5s
      start_period: 20s
      retries: 3

  # TSMDM Proxy — SOAP/REST/CDI protocol translation in front of DFO.
  # Talks to the `dfo` service over the compose network (http://dfo:8080,
  # PgWire dfo:5432). The REST port is published on host 18443 because the dfo
  # service already owns host 8443.
  tsmdm-proxy:
    build: services/tsmdm_proxy
    container_name: tsmdm-proxy
    restart: unless-stopped
    ports:
      - "3000:3000"     # SOAP  (Siebel CRM)
      - "18443:8443"    # REST  (Flask)
      - "8444:8444"     # CDI   (FastAPI)
    environment:
      DFO_REST_URL:   "http://dfo:8080"
      DFO_PGWIRE_DSN: "host=dfo port=5432 user=admin password=admin dbname=dataflow"
      DFO_TOKEN:      "${DFO_TOKEN:-}"
    depends_on:
      - dfo

volumes:
  dfo_data:
