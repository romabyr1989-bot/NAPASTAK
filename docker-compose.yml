services:
  napastak:
    build: .
    image: napastak:latest
    container_name: napastak
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      DATA_DIR:       /data
      PLUGINS_DIR:    /app/lib
      PORT:           8080
      JWT_SECRET:     a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
      ADMIN_PASSWORD: admin
      TLS_CERT:       /app/certs/cert.pem
      TLS_KEY:        /app/certs/key.pem
    volumes:
      - napastak_data:/data
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://localhost:8443/ || exit 1"]
      interval: 15s
      timeout:  5s
      start_period: 20s
      retries: 3

  # TSMDM Proxy — SOAP/REST/CDI protocol translation in front of NAPASTAK.
  # Talks to the `napastak` service over the compose network
  # (http://napastak:8080, PgWire napastak:5432). The REST port is published on
  # host 18443 because the napastak service already owns host 8443.
  tsmdm-proxy:
    build: services/tsmdm_proxy
    container_name: tsmdm-proxy
    restart: unless-stopped
    ports:
      - "3000:3000"     # SOAP  (Siebel CRM)
      - "18443:8443"    # REST  (Flask)
      - "8444:8444"     # CDI   (FastAPI)
    environment:
      DFO_REST_URL:   "http://napastak:8080"
      DFO_PGWIRE_DSN: "host=napastak port=5432 user=admin password=admin dbname=napastak"
      DFO_TOKEN:      "${DFO_TOKEN:-}"
    depends_on:
      - napastak

volumes:
  napastak_data:
